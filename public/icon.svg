      <stop offset="0" stop-color="#8678c4"/>
      <stop offset="1" stop-color="#5d4f94"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#wash)"/>
  <!-- The sidebar leaf (index.html #leaf), scaled to sit inside the maskable safe zone. -->
