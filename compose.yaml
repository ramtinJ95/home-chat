name: home-chat
services:
  app:
    build: .
    image: home-chat-local:0.1.0
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8787:8080"]
    environment:
      HOME_CHAT_LOCAL_ONLY: "1"
      HOME_CHAT_MODEL: gpt-6-sol
      HTTPS_PROXY: http://172.30.91.2:3128
      HTTP_PROXY: http://172.30.91.2:3128
      ALL_PROXY: http://172.30.91.2:3128
      NO_PROXY: ""
      NODE_USE_ENV_PROXY: "1"
      PI_SKIP_VERSION_CHECK: "1"
    volumes: ["chat-data:/data"]
    tmpfs: ["/tmp:size=128m,mode=1777", "/run:size=8m,mode=755"]
    networks:
      sealed:
        ipv4_address: 172.30.91.3
      local_ingress: {}
    depends_on: [egress]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-health.mjs"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  egress:
    image: home-chat-local:0.1.0
    entrypoint: ["node", "/app/src/egress.mjs"]
    user: "10001:10001"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      sealed:
        ipv4_address: 172.30.91.2
      internet: {}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
networks:
  sealed:
    internal: true
    ipam:
      config: [{subnet: "172.30.91.0/28"}]
  internet: {}
  local_ingress: {}
volumes:
  chat-data: {}
